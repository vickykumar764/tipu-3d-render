# Tipu 3D short — 10-frame speed test on GitHub Actions
# RENDER METHOD (2026-11-10): STILLS, not `remotion render`.
# The first speed test (run 42780616860) "succeeded" in video mode (7.0 s/frame) but the clip was
# DEFECTIVE: frames 0-1 were the correct Seringapatam fort hook, while frames 2-9 were ALL the same
# nearly flat blue sky, tiled ~5x vertically with a vertical seam at ~72% width — the fort, golden
# dome, crescent flag and characters had vanished entirely. Same failure family as Manjhi:
# multi-frame `remotion render` at 1080x1920 under SwiftShader re-presents a region of the WebGL
# canvas for frames 2+ (here the top-left sky region). Each frame is therefore rendered as a still
# (fresh browser page) by scripts/tipu-render-shard.mjs and encoded to mp4 with ffmpeg.
# PURPOSE: measure the REAL per-frame speed on an Actions runner BEFORE committing to the full
# 2,773-frame render, AND verify the frames are NOT tiled. Expected ~15-25 s/frame on Actions
# (browser launch + page load + world build + render per frame), so 10 frames take ~3-5 min.
# EXPECTED: the 10-frame clip `speed-test-10` + a log line "STILLS_DONE frames=10
# RENDER_SECONDS=<x> SECONDS_PER_FRAME=<y>".
# Then CHECK EVERY FRAME of the clip visually for tiling (a vertically repeated image, seam at ~72%
# width) — the stills method is the fix for that defect, so the speed test must prove every frame is
# clean before the full render runs.
# NOTE: workflow files cannot be pushed by a GitHub App token — create this file via the web UI
# (repo -> Add file -> Create new file -> .github/workflows/render-speed-test.yml, paste, commit).
name: Tipu speed test (10 frames)

on:
  workflow_dispatch:

jobs:
  speed-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install browsers
        # Full Playwright Chromium is the PROVEN WebGL path (the Remotion headless shell could
        # not create a WebGL context on our VM; full Chrome with --gl swangle works). Install
        # both; the render uses the Playwright Chrome explicitly.
        run: |
          npx playwright install --with-deps chromium
          npx remotion browser ensure

      - name: Install ffmpeg (ffprobe)
        # ubuntu-latest has NO ffprobe/ffmpeg; the render step below calls ffprobe and the blank
        # check calls ffmpeg. The first Manjhi speed test FAILED on exactly this (exit 127) even
        # though the render itself had finished. Install BEFORE any ffprobe/ffmpeg call.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Render frames 0-9 (stills + ffmpeg)
        env:
          REMOTION_TMP: ${{ runner.temp }}/remotion-tmp
        run: |
          CHROME=$(find ~/.cache/ms-playwright -name chrome -type f | head -1)
          echo "Chrome: $CHROME"
          mkdir -p out
          TIPU_CHROME="$CHROME" node scripts/tipu-render-shard.mjs --frames 0-9 --out out/speed-test-10.mp4

      - name: Blank check (frames must vary, not one flat colour)
        # A blank render has YDIF ~ 0 (no change between frames). Prints YAVG/YDIF per frame;
        # YDIF must be clearly > 0. The clip itself is also uploaded for a visual check.
        run: |
          ffmpeg -i out/speed-test-10.mp4 -vf signalstats -f null - 2>&1 | grep -o "YAVG:[0-9.]* YDIF:[0-9.]*" | head -5

      - name: Upload 10-frame clip
        uses: actions/upload-artifact@v4
        with:
          name: speed-test-10
          path: out/speed-test-10.mp4
          retention-days: 1
